name: Record Traffic Data

on:
  schedule:
    - cron: '30 2 * * *' # Runs nightly at 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout traffic-data branch
        uses: actions/checkout@v4
        with:
          ref: traffic-data
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch and record traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 -c "
          import urllib.request, json, os, datetime

          token = os.environ.get('TRAFFIC_TOKEN')
          repo = os.environ.get('REPO_NAME')
          headers = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'traffic-archiver'
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/traffic/views',
              headers=headers
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
          except Exception as exc:
              print(f'[traffic-archiver] Skip fetch ({exc})')
              exit(0)

          traffic_file = 'traffic.json'
          history = {}
          if os.path.exists(traffic_file):
              try:
                  with open(traffic_file, 'r', encoding='utf-8') as f:
                      existing = json.load(f)
                      for entry in existing.get('views', []):
                          history[entry['timestamp']] = entry
              except Exception:
                  pass

          for entry in data.get('views', []):
              ts = entry['timestamp']
              if ts not in history or entry.get('count', 0) > 0:
                  history[ts] = entry

          sorted_views = sorted(history.values(), key=lambda x: x['timestamp'])
          total_views = sum(v.get('count', 0) for v in sorted_views)
          total_uniques = sum(v.get('uniques', 0) for v in sorted_views)

          payload = {
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'total_views': total_views,
              'total_uniques': total_uniques,
              'views': sorted_views
          }

          with open(traffic_file, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          print(f'[traffic-archiver] Updated traffic.json: {len(sorted_views)} days recorded.')
          "

      - name: Commit and push traffic data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(traffic): record daily traffic snapshot" && git push origin traffic-data)
